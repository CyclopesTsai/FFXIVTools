[package]
name = "craft-solver"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebAssembly wrapper around the raphael-rs crafting solver for FFXIVTools"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# raphael-rs（Apache-2.0）— 固定 tag，更新時改這裡再重編
raphael-sim = { git = "https://github.com/KonaeAkira/raphael-rs", tag = "v0.29.3" }
raphael-solver = { git = "https://github.com/KonaeAkira/raphael-rs", tag = "v0.29.3" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# 獨立的 workspace，不被上層目錄影響
[workspace]
