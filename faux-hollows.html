<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻巧拼圖計算機</title>
    <link rel="stylesheet" href="css/faux-hollows.css">
    <script src="js/ga.js"></script>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← 返回導航頁</a>
    <h1>幻巧拼圖計算機</h1>
    <div class="subtitle">Faux Hollows Solver</div>

    <div class="info-bar">
        <div>符合盤面: <span id="match-count">252</span> / 252</div>
        <div class="phase-label" id="phase-label">階段：標記障礙物</div>
        <button class="reset-btn" id="reset-btn">重設棋盤</button>
    </div>

    <div class="hint-text" id="hint-text"></div>

    <div class="legend">
        <span><i class="swatch obstacle"></i>障礙物</span>
        <span><i class="swatch sword"></i>劍</span>
        <span><i class="swatch chest"></i>寶箱</span>
        <span><i class="swatch fox"></i>狐狸</span>
        <span><i class="swatch empty"></i>空格</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="score-bar" id="score-bar" style="display:none;">
        <span>剩餘翻牌次數：<span id="clicks-left">11</span></span>
    </div>
</div>

<div class="picker-overlay" id="picker-overlay">
    <div id="picker-area"></div>
</div>

<script src="js/faux-hollows-data.js?v=1"></script>
<script src="js/faux-hollows.js?v=3"></script>
</body>
</html>
